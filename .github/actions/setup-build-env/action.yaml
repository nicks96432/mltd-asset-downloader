name: Setup build environment
description: Install FFmpeg, a Rust toolchain and the cargo cache

inputs:
  toolchain:
    description: Rust toolchain to install
    default: stable
  components:
    description: Comma-separated toolchain components to install
    default: ""
  ffmpeg:
    description: Whether to install the FFmpeg development libraries
    default: "true"

runs:
  using: composite
  steps:
    - name: Select FFmpeg build
      if: inputs.ffmpeg == 'true' && runner.os == 'Windows'
      id: ffmpeg
      shell: bash
      run: |
        if [ "${{ runner.arch }}" = "ARM64" ]; then
          name=ffmpeg-n9.0.2-37-gae19868753-winarm64-lgpl-shared-9.0
        else
          name=ffmpeg-n9.0.2-37-gae19868753-win64-lgpl-shared-9.0
        fi

        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "url=https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-28-19-47/$name.zip" >> "$GITHUB_OUTPUT"

    # the GitHub release CDN sometimes fails, so the build is downloaded once for each name
    - name: Cache FFmpeg
      if: inputs.ffmpeg == 'true' && runner.os == 'Windows'
      id: ffmpeg-cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.ffmpeg.outputs.name }}
        key: ${{ steps.ffmpeg.outputs.name }}

    - name: Install FFmpeg
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
        elif [ "${{ runner.os }}" = "macOS" ]; then
          brew install ffmpeg
        elif [ "${{ runner.os }}" = "Windows" ]; then
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            # --fail makes curl retry on HTTP errors, instead of saving the error page as the zip
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 \
              --connect-timeout 30 --output ffmpeg.zip "${{ steps.ffmpeg.outputs.url }}"
            unzip -q ffmpeg.zip
            rm ffmpeg.zip
          fi

          echo "FFMPEG_DIR=$(cygpath -m "$PWD")/${{ steps.ffmpeg.outputs.name }}" >> "$GITHUB_ENV"
        fi

    - name: Install Rust
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        args=()
        IFS=',' read -ra components <<< "$COMPONENTS"
        for component in "${components[@]}"; do
          [ -n "$component" ] && args+=(--component "$component")
        done

        rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update "${args[@]}"
        rustup default "$TOOLCHAIN"

    - uses: Swatinem/rust-cache@v2.9.3
