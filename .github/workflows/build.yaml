name: Build

on:
  push:
    branches: [main]
    tags: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build project
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - uses: ./.github/actions/setup-build-env

      - name: Build
        id: build
        run: |
          export name=mltd-git-$(git describe --tags --dirty)-${{ runner.os }}

          if [ "${{ runner.os }}" = "Windows" ]; then
            export name=$name.exe

            export LIBCLANG_PATH=$(dirname "$(which clang.exe)")
            cargo build-windows --release
            mv target/release/mltd.exe "target/release/$name"
          else
            cargo build --release
            mv target/release/mltd "target/release/$name"
          fi

          echo "name=$name" >> $GITHUB_OUTPUT

        shell: bash

      - name: Publish artifact
        uses: actions/upload-artifact@v7
        with:
          path: target/release/${{ steps.build.outputs.name }}
          archive: false
          if-no-files-found: error
