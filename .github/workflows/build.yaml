name: Build

on:
  push:
    branches: [main]
    tags: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build project
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      fail-fast: false
      matrix:
        os: 
          [
            windows-latest,
            windows-11-arm,
            macos-latest,
            macos-26-intel,
            ubuntu-latest,
            ubuntu-26.04-arm
          ]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - uses: $/.github/actions/setup-build-env

      - name: Build
        id: build
        run: |
          export name=mltd-git-$(git describe --tags --dirty)-$(rustc -vV | sed -n 's|host: ||p')

          if [ "${{ runner.os }}" = "Windows" ]; then
            export name=$name.exe

            export LIBCLANG_PATH=$(dirname "$(which clang.exe)")
            cargo build-windows --release
            mv target/release/mltd.exe "target/release/$name"
          else
            cargo build --release
            mv target/release/mltd "target/release/$name"
          fi

          echo "name=$name" >> $GITHUB_OUTPUT

        shell: bash

      - name: attest
        uses: actions/attest@v4.2.2
        with:
          subject-path: target/release/${{ steps.build.outputs.name }}

      - name: Publish artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: target/release/${{ steps.build.outputs.name }}
          archive: false
          if-no-files-found: error
